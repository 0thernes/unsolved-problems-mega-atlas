# SPDX-License-Identifier: Apache-2.0
name: Daily Open-Problem Registries & Left to Solve Sync

on:
  schedule:
    # Runs daily at 06:00 UTC across all live Left to Solve program lists & 16 public open-problem trackers
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-registry-sync
  cancel-in-progress: false

jobs:
  sync-registries:
    name: Sync All Live Left to Solve Programs & 16 Public Open-Problem Trackers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package & verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mirror all live Left to Solve program lists (fails closed on incomplete crawl)
        run: python scripts/sync_lefttosolve.py --live
      - name: Poll all 16 public open-problem registries & live Left to Solve summaries (advisory telemetry only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_external_registries.py --live --write-daily
      - name: Verify refreshed mirror, daily telemetry & full pytest suite before committing
        run: |
          python scripts/sync_lefttosolve.py --offline
          python scripts/sync_external_registries.py --offline
          pytest tests/ -q
          python -c "import subprocess, pathlib; files = subprocess.check_output(['git','ls-files','--others','--cached','--exclude-standard','data/external']).decode().splitlines(); big = [f for f in files if pathlib.Path(f).stat().st_size >= 5*1024*1024]; assert not big, big; print(f'PASS: {len(files)} mirror files < 5 MB')"
      - name: Commit & push daily mirror + telemetry straight to main (outside frozen CHECKSUMS.sha256)
        id: commit
        run: |
          git config user.name "Alexander Stephen Donahue (Daily Sync)"
          git config user.email "0_0@0thernes.art"
          git add data/external results/lefttosolve_delta.json results/daily_registries.json results/lefttosolve_programs.json results/daily_registry_history.jsonl docs/lefttosolve-programs.md docs/DAILY_REGISTRY_TRACKER.md docs/registry-delta-latest.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No daily registry telemetry or mirror changes to commit."
            exit 0
          fi
          DATE_UTC=$(date -u +"%Y-%m-%d")
          LTS_META=$(python -c "import json; s=json.load(open('data/external/lefttosolve/snapshot.json', encoding='utf-8')); print(f\"{len(s['programs'])} Left to Solve fronts ({s['fetched_total']:,} targets)\")")
          git commit -m "chore(registries): daily sync ${LTS_META} & 16 public trackers (${DATE_UTC})"
          git pull --rebase origin main
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy GitHub Pages with fresh mirror & daily JSON feeds
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
