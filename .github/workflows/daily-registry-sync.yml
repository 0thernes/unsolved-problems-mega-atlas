# SPDX-License-Identifier: Apache-2.0
name: Daily Open-Problem Registries & Left to Solve Sync

on:
  schedule:
    # Runs daily at 06:00 UTC across all 16 public open-problem trackers & 25 Left to Solve fronts
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-registry-sync
  cancel-in-progress: false

jobs:
  sync-registries:
    name: Sync 16 Public Open-Problem Lists & 25 Left to Solve Fronts
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
      - name: Poll all 16 public registries & 25 Left to Solve programs (advisory telemetry only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_external_registries.py --live --write-daily
      - name: Commit & push daily telemetry snapshot straight to main (outside frozen CHECKSUMS.sha256)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/daily_registries.json results/lefttosolve_programs.json results/daily_registry_history.jsonl docs/DAILY_REGISTRY_TRACKER.md
          if git diff --cached --quiet; then
            echo "No daily registry telemetry changes to commit."
            exit 0
          fi
          DATE_UTC=$(date -u +"%Y-%m-%d")
          git commit -m "chore(registries): daily sync 16 public trackers & 25 Left to Solve fronts (${DATE_UTC})"
          git pull --rebase origin main
          git push origin main
