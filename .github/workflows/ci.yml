# SPDX-License-Identifier: Apache-2.0
name: Mega-Atlas Multi-OS, Six-Kernel Lean 4.35.0 & White Paper CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  python-verification-matrix:
    name: Python 3.12 Verification Ladder (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package & dev verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run full pytest suite on clean clone (auto-builds SQLite+FTS5, verifies byte-exact SHA-256 digests, Hypothesis, differential, metamorphic, MCP, FAIR)
        run: |
          pytest tests/ -v
      - name: Run full audit, quickstart demo, forensic audit, Zenodo dry-run, AutoResearch gates & README axiom check
        run: |
          python scripts/audit_atlas.py
          python examples/quickstart_demo.py
          python scripts/forensic_audit.py
          python scripts/publish_zenodo.py --dry-run
          python autoresearch/evaluate.py --verify-gates
          python scripts/sync_lefttosolve.py --offline
          python scripts/check_readme_axioms.py
      - name: Verify full 11-format exporter runs cleanly (--skip-pdf)
        run: |
          python src/v2_export_all.py --skip-pdf
      - name: Run static lint (ruff), typecheck (mypy) & 12-mutant semantic mutation audit (Linux)
        if: runner.os == 'Linux'
        run: |
          ruff check src rag mcp_server reference scripts examples tests research
          mypy src rag mcp_server reference scripts examples research --ignore-missing-imports
          python scripts/run_mutation_audit.py

  lean4-six-kernels:
    name: Zero-Mathlib Lean 4.35.0 Six-Kernel & Palomar Comparator Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bubblewrap and Elan (Lean 4.35.0)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clean build, 103-theorem axiom audit & 6-kernel replay (lean, leanchecker-paranoid, lean4lean, nanoda, con-leche, con-ron)
        run: |
          bash scripts/verify_lean_six_kernels.sh

  white-paper-and-provenance:
    name: AMS-LaTeX White Paper, Checksums, Secret Audit & SLSA Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify committed SHA-256 manifests, <5 MB tracked hygiene & secret scan
        run: |
          sha256sum -c CHECKSUMS.sha256
          (cd data && sha256sum -c MANIFEST.sha256)
          python scripts/stamp_timestamps.py --verify
          python -c "import subprocess, pathlib, sys; files = subprocess.check_output(['git','ls-files']).decode().splitlines(); big = [(f, pathlib.Path(f).stat().st_size) for f in files if pathlib.Path(f).exists() and pathlib.Path(f).stat().st_size >= 5*1024*1024]; assert not big, f'Tracked files >= 5MB: {big}'; print(f'PASS: All {len(files)} tracked files < 5 MB!')"
          ! grep -rnE "ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" --exclude-dir=.git --exclude-dir=.lake .
      - name: Install Tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Compile AMS-LaTeX white paper (0 overfull hboxes), verify clean-room arXiv tarball & live citations
        run: |
          mkdir -p paper/build
          (cd paper && tectonic -X compile main.tex --outdir build --keep-logs --keep-intermediates)
          ! grep -E "Overfull \\\\hbox|LaTeX Warning: Reference .* undefined|LaTeX Warning: Citation .* undefined" paper/build/main.log
          mkdir -p /tmp/arxiv_verify
          tar -xzf dist/arxiv_submission.tar.gz -C /tmp/arxiv_verify
          (cd /tmp/arxiv_verify && tectonic -X compile main.tex)
          python scripts/check_citations.py
      - name: Attest frozen white paper PDF, arXiv tarball, Lean axiom report & CHECKSUMS provenance on main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/Donahue_2026_unsolved_problems_mega_atlas.pdf
            dist/arxiv_submission.tar.gz
            results/lean_axioms.txt
            CHECKSUMS.sha256
            CHECKSUMS.sha256.tsr
            CHECKSUMS.sha256.ots
