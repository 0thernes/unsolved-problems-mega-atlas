name: Verify Mega-Atlas (Cross-Platform Python, AutoResearch, 9-Tool MCP & Pure Lean 4.35.0)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-audit-and-tests:
    name: Schema, Pytest, RAG 100%, 9-Tool MCP & SHA-256 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Master Loader, 48-Field Schema & Biconnected Connectome
        run: python src/v2_loader.py

      - name: Run Full Pytest Verification Suite
        run: pytest -v

      - name: Run Standalone Cryptographic & Structural Auditor
        run: python scripts/audit_atlas.py

      - name: Run Forensic Multi-Layer Integrity Audit
        run: python scripts/forensic_audit.py

      - name: Validate Zenodo Deposition Manifest (Offline Dry-Run)
        run: python scripts/publish_zenodo.py --dry-run

      - name: Run Immutable Karpathy AutoResearch Evaluator Gate
        run: python autoresearch/evaluate.py --verify-gates

      - name: Smoke-Test Offline Hybrid BM25 + PageRank RAG CLI & Example
        run: |
          python rag/query.py "Riemann Hypothesis zeta zeros" --top 5 --hops 1
          python rag/query.py --compare NT-001 CS-001
          python examples/query_demo.py

  lint-security-and-audit:
    name: Report-Only Linters, Secret Scan & Build Standard Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linter dependencies
        run: pip install ruff mypy
      - name: Report-only linters (ruff & mypy)
        continue-on-error: true
        run: |
          python -m ruff check src/ scripts/ rag/ mcp_server/ autoresearch/ tests/
          python -m mypy --ignore-missing-imports scripts/ rag/ mcp_server/
      - name: Build Standard v1.2.0 repo audit
        run: bash scripts/audit-repo.sh .
      - name: Secret scan (gitleaks, report-only)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lean-formal-invariants:
    name: Pure Lean 4.35.0 Formal Invariant Proofs (72 Theorems)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan & Lean 4.35.0 toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build Pure Lean 4.35.0 Proof Suite & Audit All 72 Theorems
        working-directory: lean
        run: |
          lake build 2>&1 | tee lean_build.log
          python3 -c '
          import pathlib
          log = pathlib.Path("lean_build.log").read_text(encoding="utf-8")
          allowed = {"propext", "Quot.sound"}
          audited = 0
          for line in log.splitlines():
              if "does not depend on any axioms" in line:
                  audited += 1
              elif "depends on axioms:" in line:
                  audited += 1
                  used = {x.strip() for x in line.split("[", 1)[1].rsplit("]", 1)[0].split(",") if x.strip()}
                  bad = used - allowed
                  assert not bad, f"Disallowed axiom(s) {bad} in: {line}"
          assert audited == 72, f"Expected 72 audited theorems, saw {audited}"
          print(f"LEAN CI VERIFIED: {audited} theorems strictly within [propext, Quot.sound] or empty!")
          '
