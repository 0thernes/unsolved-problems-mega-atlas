# SPDX-License-Identifier: Apache-2.0
name: Release Packaging & Checksums

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package-release:
    name: Build Full Release Bundle & SHA256SUMS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies & build full release bundle
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python src/v2_export_all.py --skip-pdf
          mkdir -p release_assets
          cp dist/Donahue_2026_unsolved_problems_mega_atlas.pdf release_assets/
          cp dist/arxiv_submission.tar.gz release_assets/
          cp outputs/MegaAtlas_Interactive_Dashboard_V2.html release_assets/
          cp outputs/MegaAtlas_Unsolved_Problems_V2.sqlite release_assets/
          cp outputs/MegaAtlas_Unsolved_Problems_V2.csv release_assets/
          cp outputs/MegaAtlas_Unsolved_Problems_V2.tsv release_assets/
          cp outputs/MegaAtlas_Unsolved_Problems_V2.json release_assets/
          cp outputs/MegaAtlas_Unsolved_Problems_V2.json.gz release_assets/
          cp outputs/MegaAtlas_Unsolved_Problems_V2.jsonl release_assets/
          cp outputs/MegaAtlas_Unsolved_Problems_V2.jsonl.gz release_assets/
          cp outputs/MegaAtlas_Unsolved_Problems_V2.xlsx release_assets/
          cp build/MegaAtlas_Unsolved_Problems_V2_Legacy.xls release_assets/
          cp outputs/MegaAtlas_Unsolved_Problems_V2.md release_assets/
          cp outputs/MegaAtlas_Unsolved_Problems_V2.txt release_assets/
          cp results/daily_registries.json results/lefttosolve_programs.json results/daily_registry_history.jsonl docs/DAILY_REGISTRY_TRACKER.md release_assets/
          cp croissant.json ro-crate-metadata.json CHECKSUMS.sha256 CHECKSUMS.sha256.tsr CHECKSUMS.sha256.ots data/MANIFEST.sha256 release_assets/
          (cd release_assets && sha256sum * > SHA256SUMS)
      - name: Attest release bundle provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release_assets/*"
      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: mega-atlas-release-bundle
          path: release_assets/
