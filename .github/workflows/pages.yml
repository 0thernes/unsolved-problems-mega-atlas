# SPDX-License-Identifier: Apache-2.0
name: Deploy Interactive Web Atlas & Lean Proof Blueprint to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static site (Interactive Atlas + 30 Charts + Lean Blueprint + FAIR/LLMs metadata)
        run: |
          mkdir -p _site/charts _site/blueprint
          cp outputs/MegaAtlas_Interactive_Dashboard_V2.html _site/index.html
          cp outputs/charts/* _site/charts/
          cp blueprint/index.html _site/blueprint/index.html
          cp llms.txt llms-full.txt croissant.json ro-crate-metadata.json _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
