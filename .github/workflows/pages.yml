# SPDX-License-Identifier: Apache-2.0
name: Deploy Interactive Web Atlas & Lean Proof Blueprint to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Republish daily 15 min after daily-registry-sync.yml (06:00 UTC) so live JSON hydrates GitHub Pages
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Assemble static site (Interactive Atlas + 30 Charts + Live Daily JSON + Lean Blueprint + FAIR/LLMs metadata)
        run: |
          mkdir -p _site/charts _site/blueprint
          cp outputs/MegaAtlas_Interactive_Dashboard_V2.html _site/index.html
          cp outputs/charts/* _site/charts/
          cp blueprint/index.html _site/blueprint/index.html
          cp llms.txt llms-full.txt croissant.json ro-crate-metadata.json _site/
          if [ -f results/daily_registries.json ]; then cp results/daily_registries.json _site/; fi
          if [ -f results/lefttosolve_programs.json ]; then cp results/lefttosolve_programs.json _site/; fi
          if [ -f results/daily_registry_history.jsonl ]; then cp results/daily_registry_history.jsonl _site/; fi
          if [ -d data/external/lefttosolve ]; then mkdir -p _site/external && cp -r data/external/lefttosolve _site/external/lefttosolve; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
