# SPDX-License-Identifier: Apache-2.0
name: Academic & Formal-Verification Review
description: Submit an independent critique of mathematical accuracy, Lean statement fidelity, or editorial scores
title: "[review]: "
labels: ["concern"]
body:
  - type: dropdown
    id: finding_class
    attributes:
      label: Finding Class (Build Standard v1.2.0)
      options:
        - error
        - bug
        - issue
        - problem
        - concern
        - dilemma
        - conflict
        - gap
        - hole
        - blindspot
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target Problem ID, Theorem, or Paper Section
      placeholder: "e.g., NT-001, MegaAtlasProofs.Scoring.cssBps_le_max, Section 4"
    validations:
      required: true
  - type: textarea
    id: critique
    attributes:
      label: Technical Critique & Primary Citations (DOIs / arXiv IDs)
    validations:
      required: true
