version: "v0.4"
release_version: "2.9.0"

project:
  name: "Unsolved Problems Mega-Atlas Software-Model Invariant Suite (MegaAtlasProofs)"
  description: >-
    Zero-Mathlib Lean 4.35.0 formalization of 103 audited declarations (of 117 theorem/lemma
    declarations in lean/: 72 in the core modules + 12 non-vacuity and negative-boundary
    witnesses + 10 refutations of weakened definitions + 9 headline Palomar comparator targets;
    5 private helper lemmas in GraphInvariants and 9 intermediate Solution wrappers are not in
    the #print axioms audit list) about the atlas software model: integer bounds of the CSS,
    Titan, leverage and AQS formulas for in-range inputs, monotonicity of CSS, Titan and leverage,
    quadrant iff characterisations and a monotone era map, sizes of the pillar,
    superdomain, substrate and layer lists (with completeness for the first three), a
    generic list-multigraph handshaking lemma and cross-partition edge hierarchy, a
    deduplication length bound, the AutoResearch keep/discard rule, pairwise comparison
    antisymmetry, and gradient/margin/bridge bounds. No Lean statement refers to the
    2,000-row atlas data, its 6,108-edge graph or biconnectivity; those are checked in
    Python. Several counted theorems are literal arithmetic identities or restate a
    hypothesis.
  authors:
    - name: "Alexander Stephen Donahue"
      orcid: "0009-0006-8168-9648"
      email: "0_0@0thernes.art"
      affiliation: "Independent Researcher, Spokane, WA, USA"
  responsible_maintainers:
    - name: "Alexander Stephen Donahue"
      github: "0thernes"
      orcid: "0009-0006-8168-9648"
      email: "0_0@0thernes.art"
  license: "Apache-2.0"

