fidelity:
  divergences: >-
    Lean 4.35.0 verifies exact integer basis-point/centi-unit scoring formulas with
    abstract bounded centrality/degree inputs (`cent100 <= 100`, `degTermTenths <= 100`),
    whereas the Python runtime (`src/v2_loader.py`) evaluates the transcendental
    `min(100.0, 25.0 * ln(1 + degree))` term in IEEE-754 float64, differentially checked
    against an exact Python reference oracle across 2,000+ randomized and atlas cases.
    See `docs/statement-fidelity.md` for the complete row-by-row fidelity matrix.

review:
  status: "self-assessed"
  notes: >-
    Not externally peer-reviewed. Machine-checked across all 6 independent Lean 4.35.0
    proof kernels via `scripts/verify_lean_six_kernels.sh` (Lean default,
    leanchecker --fresh, leanchecker-paranoid, lean4lean, nanoda_bin, con-leche --verified,
    con-ron --verified, plus sandboxed Palomar comparator and live negative kernel rejection),
    with 0 warnings, 0 proof sorries in `lean/`, 0 native_decide, 12 concrete NonVacuity
    witnesses, and 10 constructive AdversarialTests refutations.
