fidelity:
  divergences: >-
    Lean 4.35.0 verifies exact integer basis-point/centi-unit scoring formulas with
    abstract bounded centrality/degree inputs (`cent100 <= 100`, `degTermTenths <= 100`),
    whereas the Python runtime (`src/v2_loader.py`) evaluates the transcendental
    `min(100.0, 25.0 * ln(1 + degree))` term in IEEE-754 float64, differentially checked
    against an exact Python reference oracle across 2,000+ randomized and atlas cases.
    See `docs/statement-fidelity.md` for the complete row-by-row fidelity matrix.

review:
  status: "self-assessed"
  notes: >-
    Not externally peer-reviewed. Kernel-checked by Lean (lake build, leanchecker --fresh,
    leanchecker-paranoid) via `scripts/verify_lean_six_kernels.sh`; an export of three
    headline theorems with their dependency closure is also checked by nanoda_bin,
    con-leche --verified and con-ron --verified, and the 9 comparator targets were
    accepted by the sandboxed Palomar comparator (six kernel checks, five distinct
    implementations, in Ubuntu CI). A deliberately false theorem is rejected. 0 proof
    sorries in `lean/`, 0 native_decide, 12 NonVacuity witnesses and 10
    AdversarialTests refutations.
