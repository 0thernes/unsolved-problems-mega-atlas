[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unsolved-problems-mega-atlas"
version = "2.3.1"
description = "1,900-problem biconnected open-problems connectome across 8 Macro-Pillars x 28 Superdomains x 8 Substrates x 7 Abstraction Layers, with 0thernes CSS, Hybrid FTS5 RAG (100% MRR@5) & 9-tool MCP server, Karpathy AutoResearch, FAIR Croissant/RO-Crate/Zenodo metadata, Nov 2026 AI proof-claim audit & 72 Pure Lean 4.35.0 formal invariants."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT AND CC-BY-4.0" }
authors = [
  { name = "Alexander Stephen Donahue", email = "0_0@0thernes.art" },
]
keywords = [
  "unsolved-problems",
  "open-problems",
  "knowledge-graph",
  "lean4",
  "formal-verification",
  "rag",
  "research-infrastructure",
]
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scipy>=1.13.0",
  "matplotlib>=3.9.0",
  "seaborn>=0.13.0",
  "networkx>=3.3",
  "openpyxl>=3.1.2",
  "xlwt>=1.3.0",
  "pillow>=10.0.0",
  "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://0thernes.art"
Repository = "https://github.com/0thernes/unsolved-problems-mega-atlas"
"Interactive Atlas" = "https://0thernes.github.io/unsolved-problems-mega-atlas/"
"Master Archive" = "https://github.com/0thernes/0thernes-research-archive"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
