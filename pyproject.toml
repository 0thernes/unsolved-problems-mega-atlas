[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unsolved-problems-mega-atlas"
version = "2.9.0"
description = "1,900 deduplicated unsolved, open & hard problems across 8 Pillars, 28 Superdomains, 8 Substrates & 7 Layers (5,808 edges audited biconnected in Python), 103 audited Lean 4.35.0 software-model theorems, offline Hybrid RAG (100% MRR@5), 11-tool MCP server, 3 Track B probes & AMS-LaTeX white paper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Alexander Stephen Donahue", email = "0_0@0thernes.art" },
]
keywords = [
  "unsolved-problems", "open-problems", "knowledge-graph", "lean4",
  "formal-verification", "rag", "mcp", "autoresearch", "fair-data",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "networkx>=3.2",
  "openpyxl>=3.1",
  "xlwt>=1.3",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "ruff>=0.15",
  "mypy>=1.10",
  "pymupdf>=1.24",
]

[project.urls]
Homepage = "https://0thernes.github.io/unsolved-problems-mega-atlas/"
Repository = "https://github.com/0thernes/unsolved-problems-mega-atlas"
Documentation = "https://github.com/0thernes/unsolved-problems-mega-atlas/blob/main/docs/WHITE_PAPER.md"
Issues = "https://github.com/0thernes/unsolved-problems-mega-atlas/issues"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = false
